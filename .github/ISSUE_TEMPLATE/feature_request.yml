name: Feature request
description: A new resource type, provider, option or API change.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For a large change (a new provider, new resources or an API change), agree on the direction here before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Cloudonym to do. For a new naming rule, link the provider's official document — rules without an official source are not accepted.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, if any.
