# 규칙 출처 감지 (D43) — 월 1회 원문을 받아 docs/rule-sources.lock.json 과 대어 본다.
# 다르면 job 이 실패하고 issue 를 연다. 규칙을 고치거나 PR 을 만들지는 않는다 — 사람이 행을 읽고 판정한다.
name: rule-sources

on:
  schedule:
    # cron 은 UTC 로만 적는다 — 매월 1일 18:00 UTC = 매월 2일 03:00 KST
    - cron: '0 18 1 * *'
  workflow_dispatch:

# 외부 원문을 받는 job 에는 읽기 권한만 준다 — issue 를 여는 권한은 그 뒤 따로 도는 job 에만 둔다
permissions:
  contents: read

concurrency:
  group: rule-sources
  cancel-in-progress: false

# 액션은 ci.yml 과 같은 커밋 SHA 로 고정한다 — 태그는 옮길 수 있다
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # 시험이 쓰는 개발 의존성(ajv — scripts/catalog/build-catalog.mjs)을 받는다. 외부 원문을 받기 전이라 lockfile 그대로만 깐다
      - run: npm ci --ignore-scripts

      # 검사기를 먼저 시험한다 — 고정 표본에서 lock 한 글자 변경이 exit 1 이 되는지
      - run: npm run test:rules

      - name: fetch sources
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ runner.temp }}/rule-sources
        run: |
          set -euo pipefail
          mkdir -p "${SRC}/aws"
          curl -fsSL --retry 3 -o "${SRC}/azure.md" https://raw.githubusercontent.com/MicrosoftDocs/azure-docs/main/articles/azure-resource-manager/management/resource-name-rules.md
          curl -fsSL --retry 3 -o "${SRC}/azure.html" https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/resource-name-rules
          curl -fsSL --retry 3 -o "${SRC}/compute.json" https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
          curl -fsSL --retry 3 -o "${SRC}/cloudkms.json" https://www.googleapis.com/discovery/v1/apis/cloudkms/v1/rest
          curl -fsSL --retry 3 -o "${SRC}/aws.zip" https://schema.cloudformation.us-east-1.amazonaws.com/CloudformationSchema.zip
          unzip -q "${SRC}/aws.zip" -d "${SRC}/aws"
          commit="$(gh api 'repos/MicrosoftDocs/azure-docs/commits?path=articles/azure-resource-manager/management/resource-name-rules.md&per_page=1' --jq '.[0].sha')"
          # GITHUB_ENV 에 넣기 전에 꼴을 본다 — 40자 16진 SHA 만 받는다
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then echo "unexpected commit sha: ${commit:0:80}"; exit 1; fi
          echo "AZURE_COMMIT=${commit}" >> "${GITHUB_ENV}"

      - name: check sources
        env:
          SRC: ${{ runner.temp }}/rule-sources
        run: |
          node scripts/rules/check-sources.mjs --lock docs/rule-sources.lock.json \
            --azure "${SRC}/azure.md" --azure-html "${SRC}/azure.html" --azure-commit "${AZURE_COMMIT}" \
            --gcp "${SRC}/compute.json" --gcp-kms "${SRC}/cloudkms.json" --aws "${SRC}/aws"

  # check 가 실패하면(받기 실패 포함) issue 를 하나 연다. 같은 제목의 열린 issue 가 있으면 새로 열지 않는다
  # 이 job 은 외부 원문을 받지 않고 저장소도 checkout 하지 않는다 — issues: write 는 여기에만 있다
  report:
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Rule sources changed or could not be checked"
          open="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number --jq 'length')"
          if [ "${open}" != "0" ]; then
            echo "an open issue already exists — skipping"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "The monthly rule-source check failed: ${run_url}

          Read the changed rows, update the rules if needed, then refresh docs/rule-sources.lock.json with \`node scripts/rules/check-sources.mjs ... --write\`."
