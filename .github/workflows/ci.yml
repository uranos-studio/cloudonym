# 개발 4단계 Task 4-2 — push · PR 마다 시험 · 타입 · 린트 · 빌드를 돈다. 어느 하나라도 실패하면 job 이 non-zero 로 끝난다
name: ci

on:
  push:
    # 태그 push 는 deploy.yml 이 같은 검사를 돌리므로 여기서는 브랜치만 받는다
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # package.json 에 packageManager 가 없어 자동 캐시가 켜지지 않는다 — 명시한다
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
