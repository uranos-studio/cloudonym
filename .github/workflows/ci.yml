# 개발 4단계 Task 4-2 — push · PR 마다 시험 · 타입 · 린트 · 빌드를 돈다. 어느 하나라도 실패하면 job 이 non-zero 로 끝난다
name: ci

on:
  push:
    # 태그 push 는 deploy.yml 이 같은 검사를 돌리므로 여기서는 브랜치만 받는다
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 액션은 커밋 SHA 로 고정한다 — 태그는 옮길 수 있다. 올릴 때는 gh api repos/<owner>/<repo>/git/ref/tags/<tag> 로 SHA 를 찾는다 (보안 리뷰 L-3)
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # package.json 에 packageManager 가 없어 자동 캐시가 켜지지 않는다 — 명시한다
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # 규칙 버전 대조 (D26) — main 의 지문 파일과 비교해 revision 을 안 올린 규칙 변경 · 규칙 변경 없는 revision 을 막는다.
      # checkout 은 얕은 clone 이라 main 을 따로 받는다. main 에 파일이 없으면(첫 도입) 통과한다
      - name: rules revision
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          if git cat-file -e origin/main:src/core/rules-fingerprint.json 2>/dev/null; then
            git show origin/main:src/core/rules-fingerprint.json > "${RUNNER_TEMP}/base-rules-fingerprint.json"
            node scripts/check-rules-revision.mjs "${RUNNER_TEMP}/base-rules-fingerprint.json" src/core/rules-fingerprint.json
          else
            node scripts/check-rules-revision.mjs src/core/rules-fingerprint.json
          fi
