# 태그 v* 가 붙을 때만 Cloudflare Workers 로 배포한다.
# 배포는 항상 `npm run deploy`(빌드 포함)로 한다
name: deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# 태그 두 개가 연달아 밀려도 배포는 하나씩 — 진행 중인 wrangler deploy 는 끊지 않는다
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 액션은 커밋 SHA 로 고정한다 — 이 job 은 CLOUDFLARE_API_TOKEN 을 쥐고 돈다. 태그가 옮겨지면 남의 코드가 토큰을 본다
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main 조상 판정에 전체 이력이 필요하다
          fetch-depth: 0

      # GitHub 은 태그 트리거를 브랜치로 거를 수 없다 — main 에 들어간 커밋의 태그만 배포한다
      - name: Tag commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main — refusing to deploy"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # 시크릿을 쓰는 workflow 에서는 자동 캐시를 끈다 (setup-node README 권고)
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

      - name: Deploy (build included)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
